name: Intraday Agent test suite

on:
  push:
    branches:
      - stage2-data-quality-investigation
      - stage7-strategy-validation
  pull_request:
    branches:
      - main

jobs:
  quality-gate-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_intraday_agent_stage1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
